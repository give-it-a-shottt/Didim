# Alembic config (D-015). ASCII only: on Korean Windows this file is read as cp949 (T-003).
# The DB URL is NOT stored here; migrations/env.py reads DATABASE_URL from the environment.
# Usage (from backend/), see Admin_Docs/START_HERE.md:
#   uv run --env-file .env alembic upgrade head
#   uv run --env-file .env alembic revision --autogenerate --rev-id 0002 -m "add something"
#   uv run --env-file .env alembic current

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# version file name: 0001_slug.py (pass the number with --rev-id)
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
