[project]
name = "didim-backend"
version = "0.1.0"
description = "디딤 API 서버 (FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_startup_check: 서버 시작 때의 DB 버전 확인을 건너뛰지 않는다(tests/conftest.py)",
]
